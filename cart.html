<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigitQuo | My Cart</title>
  <meta name="robots" content="noindex,follow" />
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="account-page-view">
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="logo"><span class="logo-icon"><img src="images/LOGO.png" alt="DigitQuo logo" class="logo-mark" /></span><span class="logo-word">Digit<span>Quo</span></span></a>
      <a href="login.html" class="mobile-login" aria-label="Login">&#128100;</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="about.html">About</a></li>
        <li class="nav-dropdown">
          <a class="nav-dropdown-trigger" href="pricing.html" aria-haspopup="true">Pricing <span class="nav-dropdown-caret" aria-hidden="true">&#9662;</span></a>
          <ul class="nav-dropdown-menu" aria-label="Pricing options">
            <li><a href="pricing.html">Website Pricing</a></li>
            <li><a href="bot-pricing.html">Bot Pricing</a></li>
          </ul>
        </li>
        <li><a href="contact.html">Support</a></li>
        <li id="adminNavItem" style="display: none;"><a href="admin.html" style="color: #ef4444; font-weight: 600;">&#9889; Admin Panel</a></li>
      </ul>
      <a href="login.html" class="btn btn-primary nav-cta" id="loginBtn">Login</a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container cart-shell">
        <div id="cartContent"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.dqAuth) {
        window.dqAuth.bindAdminUi({
          loginButtonId: "loginBtn",
          adminNavItemId: "adminNavItem",
        }).catch((error) => {
          console.error("Error binding admin controls:", error);
        });
      }
    });
  </script>
</body>
</html>
