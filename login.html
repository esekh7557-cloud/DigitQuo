<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigitQuo | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #fdfbff;
      --bg-2: #f5f3ff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --primary: #6d28d9;
      --primary-hover: #4c1d95;
      --accent: #a855f7;
      --border: #e9ddfc;
      --focus: #a855f7;
      --error: #c83232;
      --ok: #4c1d95;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Plus Jakarta Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 18%, rgba(255,255,255,0.95) 0%, transparent 34%),
        radial-gradient(circle at 84% 82%, rgba(196,181,253,0.9) 0%, transparent 28%),
        radial-gradient(circle at 78% 18%, rgba(233,221,252,0.9) 0%, transparent 22%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(250,245,255,0.98));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 34px 28px;
      box-shadow: 0 24px 55px rgba(76, 29, 149, 0.14);
    }

    h1 {
      font-size: 1.85rem;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.97rem;
    }

    .status {
      min-height: 22px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .status.error {
      color: var(--error);
    }

    .status.ok {
      color: var(--ok);
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 13px;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.14);
    }

    .actions {
      margin: 6px 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }

    .remember input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    .link-btn {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--primary);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.97rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 12px 24px rgba(109, 40, 217, 0.22);
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(109, 40, 217, 0.26);
    }

    .toggle {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
        border-radius: 15px;
      }

      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <main class="login-card" role="main">
    <h1 id="title">Welcome back</h1>
    <p class="subtitle" id="subtitle">Sign in to access your DigitQuo dashboard.</p>
    <p class="status" id="statusText" aria-live="polite"></p>

    <form id="authForm" novalidate>
      <div class="field" id="nameField" hidden>
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" placeholder="Your full name" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="field" id="phoneField" hidden>
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" placeholder="+91 98765 43210" />
      </div>

      <div class="field" id="photoField" hidden>
        <label for="profilePhoto">Profile photo</label>
        <input id="profilePhoto" name="profilePhoto" type="file" accept="image/*" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" minlength="8" required />
      </div>

      <div class="field" id="newPasswordField" hidden>
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" placeholder="Create a new password" minlength="8" />
      </div>

      <div class="field" id="confirmPasswordField" hidden>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your new password" minlength="8" />
      </div>

      <div class="actions" id="rememberRow">
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox" />
          Remember me
        </label>
        <button class="link-btn" id="forgotPasswordBtn" type="button">Forgot password?</button>
      </div>

      <button class="btn" id="submitBtn" type="submit">Log In</button>
    </form>

    <p class="toggle">
      <span id="toggleLabel">Don't have an account?</span>
      <a href="#" id="toggleMode">Create one</a>
    </p>
    <p class="footer">Back to <a href="index.html">Home</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const authForm = document.getElementById("authForm");
    const statusText = document.getElementById("statusText");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const toggleMode = document.getElementById("toggleMode");
    const toggleLabel = document.getElementById("toggleLabel");
    const submitBtn = document.getElementById("submitBtn");
    const rememberRow = document.getElementById("rememberRow");
    const nameField = document.getElementById("nameField");
    const phoneField = document.getElementById("phoneField");
    const photoField = document.getElementById("photoField");
    const nameInput = document.getElementById("fullName");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");
    const photoInput = document.getElementById("profilePhoto");
    const passwordInput = document.getElementById("password");
    const newPasswordField = document.getElementById("newPasswordField");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordField = document.getElementById("confirmPasswordField");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const rememberInput = document.getElementById("remember");
    const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");
    const REMEMBERED_EMAIL_KEY = "dq_remembered_email";
    const dqAuth = window.dqAuth;

    let mode = "login";
    function setStatus(message, type) {
      statusText.textContent = message || "";
      statusText.className = "status";
      if (type) {
        statusText.classList.add(type);
      }
    }

    function applyMode(clearStatus = true) {
      const isLogin = mode === "login";
      const isRegister = mode === "register";
      const isRecoveryRequest = mode === "recover-request";
      const isRecoveryVerify = mode === "recover-verify";

      title.textContent = isLogin
        ? "Welcome back"
        : isRegister
          ? "Create account"
          : isRecoveryRequest
            ? "Forgot password"
            : "Reset password";

      subtitle.textContent = isLogin
        ? "Sign in to access your DigitQuo dashboard."
        : isRegister
          ? "Create your account to start using DigitQuo."
          : isRecoveryRequest
            ? "Enter your email and we will send you a password reset link."
            : "Open the reset link from your email, then choose a new password.";

      submitBtn.textContent = isLogin
        ? "Log In"
        : isRegister
          ? "Create Account"
          : isRecoveryRequest
            ? "Reset Password"
            : "Reset Password";

      rememberRow.style.display = isLogin ? "flex" : "none";
      nameField.hidden = !isRegister;
      phoneField.hidden = !isRegister;
      photoField.hidden = !isRegister;
      newPasswordField.hidden = !isRecoveryVerify;
      confirmPasswordField.hidden = !isRecoveryVerify;
      passwordInput.parentElement.hidden = isRecoveryRequest || isRecoveryVerify;

      nameInput.required = isRegister;
      phoneInput.required = isRegister;
      passwordInput.required = isLogin || isRegister;
      newPasswordInput.required = isRecoveryVerify;
      confirmPasswordInput.required = isRecoveryVerify;

      toggleLabel.textContent = isLogin
        ? "Don't have an account?"
        : isRegister
          ? "Already have an account?"
          : "Remembered your password?";

      toggleMode.textContent = isLogin
        ? "Create one"
        : "Log in";

      forgotPasswordBtn.hidden = !isLogin;

      if (!isRecoveryVerify) {
        newPasswordInput.value = "";
        confirmPasswordInput.value = "";
      }

      if (clearStatus) {
        setStatus("");
      }
    }

    function setMode(nextMode, clearStatus = true) {
      mode = nextMode;
      applyMode(clearStatus);
    }

    function loadRememberedLogin() {
      const savedEmail = window.localStorage.getItem(REMEMBERED_EMAIL_KEY);
      if (!savedEmail) {
        return;
      }

      emailInput.value = savedEmail;
      rememberInput.checked = true;
    }

    function persistRememberedLogin(email, remember) {
      if (remember) {
        window.localStorage.setItem(REMEMBERED_EMAIL_KEY, email);
        return;
      }

      window.localStorage.removeItem(REMEMBERED_EMAIL_KEY);
    }

    function readPhotoFile(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          resolve("");
          return;
        }

        if (!file.type.startsWith("image/")) {
          reject(new Error("Please choose an image file."));
          return;
        }

        if (file.size > 1_500_000) {
          reject(new Error("Profile photo must be smaller than 1.5 MB."));
          return;
        }

        const reader = new FileReader();
        reader.onload = () => resolve(typeof reader.result === "string" ? reader.result : "");
        reader.onerror = () => reject(new Error("Could not read the selected image."));
        reader.readAsDataURL(file);
      });
    }

    function getConfigErrorMessage() {
      return "Add your Supabase project URL and anon key in supabase-config.js before using login.";
    }

    async function checkSession() {
      if (!dqAuth || !dqAuth.isConfigured()) {
        setStatus(getConfigErrorMessage(), "error");
        return;
      }

      try {
        const user = await dqAuth.getCurrentUser();
        if (!user) {
          return;
        }

        setStatus(`Signed in as ${user.email}`, "ok");
      } catch (error) {
        setStatus(error.message || "Could not connect to Supabase.", "error");
      }
    }

    toggleMode.addEventListener("click", (event) => {
      event.preventDefault();

      if (mode === "login") {
        setMode("register");
        return;
      }

      setMode("login");
    });

    forgotPasswordBtn.addEventListener("click", () => {
      setMode("recover-request");
    });

    async function requestPasswordReset(client, email) {
      const redirectTo = `${window.location.origin}${window.location.pathname}?mode=recovery`;
      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });

      if (error) {
        throw error;
      }

      setStatus("Reset link sent. Check your email, open the link, then set your new password.", "ok");
    }

    async function handlePasswordRecoveryFromLink(client) {
      const query = new URLSearchParams(window.location.search);
      if (query.get("mode") !== "recovery") {
        return;
      }

      const { data, error } = await client.auth.getSession();
      if (error || !data.session) {
        setMode("recover-request", false);
        setStatus("Open the password reset link from your email to continue.", "error");
        return;
      }

      setMode("recover-verify", false);
      setStatus("Recovery session detected. Enter your new password below.", "ok");
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("");

      const email = emailInput.value.trim();
      const fullName = nameInput.value.trim();
      const phone = phoneInput.value.trim();
      const password = passwordInput.value;
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const remember = rememberInput.checked;

      if (!email) {
        setStatus("Enter a valid email address.", "error");
        return;
      }

      if (mode === "login" && password.length < 8) {
        setStatus("Enter a valid email and a password of at least 8 characters.", "error");
        return;
      }

      if (mode === "register" && (password.length < 8 || !fullName || !phone)) {
        setStatus("Enter a valid email and a password of at least 8 characters.", "error");
        return;
      }

      if (mode === "recover-verify") {
        if (newPassword.length < 8 || newPassword !== confirmPassword) {
          setStatus("Enter matching passwords with at least 8 characters.", "error");
          return;
        }
      }

      submitBtn.disabled = true;
      submitBtn.textContent = mode === "login"
        ? "Logging in..."
        : mode === "register"
          ? "Creating..."
          : mode === "recover-request"
            ? "Sending..."
            : "Resetting...";

      try {
        if (!dqAuth || !dqAuth.isConfigured()) {
          setStatus(getConfigErrorMessage(), "error");
          return;
        }

        const client = await dqAuth.getClient();

        if (mode === "register") {
          const profilePhoto = await readPhotoFile(photoInput.files[0]);
          const { error } = await client.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: fullName,
                phone,
                profile_photo: profilePhoto,
              },
            },
          });

          if (error) {
            setStatus(error.message || "Could not create account.", "error");
            return;
          }

          setMode("login", false);
          setStatus("Account created. Check your email if confirmation is enabled, then log in.", "ok");
          return;
        }

        if (mode === "recover-request") {
          await requestPasswordReset(client, email);
          return;
        }

        if (mode === "recover-verify") {
          const { error } = await client.auth.updateUser({ password: newPassword });
          if (error) {
            setStatus(error.message || "Could not update password.", "error");
            return;
          }

          setMode("login", false);
          passwordInput.value = "";
          newPasswordInput.value = "";
          confirmPasswordInput.value = "";
          setStatus("Password updated. You can now log in with your new password.", "ok");
          return;
        }

        const { data, error } = await client.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          setStatus(error.message || "Login failed.", "error");
          return;
        }

        persistRememberedLogin(email, remember);
        setStatus(`Welcome, ${data.user.email}`, "ok");
        window.setTimeout(() => {
          window.location.href = "index.html";
        }, 900);
      } catch (error) {
        setStatus(error.message || "Could not connect to Supabase.", "error");
      } finally {
        submitBtn.disabled = false;
        applyMode(false);
      }
    });

    applyMode();
    loadRememberedLogin();
    checkSession();
    if (dqAuth && dqAuth.isConfigured()) {
      dqAuth.getClient()
        .then(async (client) => {
          if (!client) {
            return;
          }

          client.auth.onAuthStateChange((eventName) => {
            if (eventName === "PASSWORD_RECOVERY") {
              setMode("recover-verify", false);
              setStatus("Recovery link confirmed. Enter your new password below.", "ok");
            }
          });

          await handlePasswordRecoveryFromLink(client);
        })
        .catch(() => {
          // Keep the page usable even if the auth client cannot initialize here.
        });
    }
  </script>
</body>
</html>
