<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigitQuo | Login</title>
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://digitquo.in/login.html" />
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #fdfbff;
      --bg-2: #f5f3ff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --primary: #6d28d9;
      --primary-hover: #4c1d95;
      --accent: #a855f7;
      --border: #e9ddfc;
      --focus: #a855f7;
      --error: #c83232;
      --ok: #4c1d95;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Plus Jakarta Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 14% 18%, rgba(255,255,255,0.95) 0%, transparent 34%),
        radial-gradient(circle at 84% 82%, rgba(196,181,253,0.9) 0%, transparent 28%),
        radial-gradient(circle at 78% 18%, rgba(233,221,252,0.9) 0%, transparent 22%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(250,245,255,0.98));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 34px 28px;
      box-shadow: 0 24px 55px rgba(76, 29, 149, 0.14);
    }

    h1 {
      font-size: 1.85rem;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.97rem;
    }

    .status {
      min-height: 22px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .status.error {
      color: var(--error);
    }

    .status.ok {
      color: var(--ok);
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 13px;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.14);
    }

    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .password-toggle:hover {
      color: var(--primary);
      background: rgba(168, 85, 247, 0.08);
    }

    .password-toggle:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .actions {
      margin: 6px 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }

    .remember input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    .link-btn {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--primary);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.97rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 12px 24px rgba(109, 40, 217, 0.22);
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(109, 40, 217, 0.26);
    }

    .oauth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 20px;
      color: var(--muted);
      font-size: 0.84rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .oauth-divider::before,
    .oauth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .google-btn {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      background: #fff;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .google-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(31, 41, 55, 0.08);
      border-color: #d1d5db;
    }

    .google-btn:disabled {
      cursor: wait;
      opacity: 0.8;
      transform: none;
      box-shadow: none;
    }

    .google-btn svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .admin-toggle {
      display: none;
      margin-bottom: 18px;
      padding: 14px;
      background: #f3f4f6;
      border-radius: 11px;
      border: 1px solid var(--border);
    }

    .admin-toggle.visible {
      display: block;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toggle-label {
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text);
    }

    .toggle-switch {
      position: relative;
      display: inline-flex;
      width: 56px;
      height: 28px;
      background: #d1d5db;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      border: none;
      padding: 0;
    }

    .toggle-switch.active {
      background: #6d28d9;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: left 0.3s ease;
    }

    .toggle-switch.active::after {
      left: 30px;
    }

    .role-text {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 8px;
    }

    .admin-notice {
      font-size: 0.82rem;
      color: #d97706;
      margin-top: 8px;
      display: none;
    }

    .admin-notice.visible {
      display: block;
    }

    .toggle {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
        border-radius: 15px;
      }

      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <main class="login-card" role="main">
    <h1 id="title">Welcome back</h1>
    <p class="subtitle" id="subtitle"></p>
    <p class="status" id="statusText" aria-live="polite"></p>

    <form id="authForm" novalidate>
      <div class="field" id="nameField" hidden>
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" type="text" placeholder="Your full name" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="field" id="phoneField" hidden>
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" placeholder="+91 98765 43210" />
      </div>

      <div class="field" id="countryField" hidden>
        <label for="country">Country</label>
        <input id="country" name="country" type="text" placeholder="India" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" placeholder="Enter your password" minlength="8" required />
          <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false"></button>
        </div>
      </div>

      <div class="field" id="newPasswordField" hidden>
        <label for="newPassword">New password</label>
        <div class="password-field">
          <input id="newPassword" name="newPassword" type="password" placeholder="Create a new password" minlength="8" />
          <button class="password-toggle" type="button" data-password-toggle="newPassword" aria-label="Show new password" aria-pressed="false"></button>
        </div>
      </div>

      <div class="field" id="confirmPasswordField" hidden>
        <label for="confirmPassword">Confirm new password</label>
        <div class="password-field">
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your new password" minlength="8" />
          <button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show confirm password" aria-pressed="false"></button>
        </div>
      </div>

      <div class="field terms-field" id="termsField" hidden>
        <label class="remember" for="termsCheckbox">
          <input id="termsCheckbox" type="checkbox" />
          I agree to the <a href="terms-and-conditions.html" target="_blank" rel="noopener noreferrer">Terms &amp; Conditions</a>
        </label>
      </div>

      <div class="field terms-field" id="refundField" hidden>
        <label class="remember" for="refundCheckbox">
          <input id="refundCheckbox" type="checkbox" />
          I agree to the <a href="refund-policy.html" target="_blank" rel="noopener noreferrer">Refund Policy</a>
        </label>
      </div>

      <div class="actions" id="rememberRow">
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox" />
          Remember me
        </label>
        <button class="link-btn" id="forgotPasswordBtn" type="button">Forgot password?</button>
      </div>

      <button class="btn" id="submitBtn" type="submit">Log In</button>
    </form>

    <div id="oauthSection">
      <div class="oauth-divider"><span>or</span></div>
      <button class="google-btn" id="googleAuthBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#EA4335" d="M12 10.2v3.92h5.45c-.24 1.26-.96 2.32-2.04 3.03l3.3 2.56c1.92-1.77 3.03-4.37 3.03-7.46 0-.71-.06-1.39-.19-2.05H12z"></path>
          <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.61-2.44l-3.3-2.56c-.92.62-2.09.98-3.31.98-2.54 0-4.69-1.72-5.46-4.03H3.13v2.63A9.99 9.99 0 0 0 12 22z"></path>
          <path fill="#FBBC04" d="M6.54 13.95A5.98 5.98 0 0 1 6.24 12c0-.68.12-1.34.3-1.95V7.42H3.13A9.99 9.99 0 0 0 2 12c0 1.61.38 3.13 1.13 4.58l3.41-2.63z"></path>
          <path fill="#4285F4" d="M12 6.02c1.47 0 2.79.51 3.83 1.5l2.87-2.87C16.95 3.02 14.7 2 12 2 8.09 2 4.72 4.24 3.13 7.42l3.41 2.63c.77-2.31 2.92-4.03 5.46-4.03z"></path>
        </svg>
        <span id="googleAuthLabel">Continue with Google</span>
      </button>
    </div>

    <p class="toggle">
      <span id="toggleLabel">Don't have an account?</span>
      <a href="#" id="toggleMode">Create one</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const authForm = document.getElementById("authForm");
    const statusText = document.getElementById("statusText");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const toggleMode = document.getElementById("toggleMode");
    const toggleLabel = document.getElementById("toggleLabel");
    const submitBtn = document.getElementById("submitBtn");
    const oauthSection = document.getElementById("oauthSection");
    const googleAuthBtn = document.getElementById("googleAuthBtn");
    const googleAuthLabel = document.getElementById("googleAuthLabel");
    const rememberRow = document.getElementById("rememberRow");
    const nameField = document.getElementById("nameField");
    const phoneField = document.getElementById("phoneField");
    const countryField = document.getElementById("countryField");
    const termsField = document.getElementById("termsField");
    const termsCheckbox = document.getElementById("termsCheckbox");
    const refundField = document.getElementById("refundField");
    const refundCheckbox = document.getElementById("refundCheckbox");
    const nameInput = document.getElementById("fullName");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");
    const countryInput = document.getElementById("country");
    const passwordInput = document.getElementById("password");
    const newPasswordField = document.getElementById("newPasswordField");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordField = document.getElementById("confirmPasswordField");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const rememberInput = document.getElementById("remember");
    const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");
    const REMEMBERED_EMAIL_KEY = "dq_remembered_email";
    const dqAuth = window.dqAuth;

    function getPasswordToggleIcon(isVisible) {
      if (isVisible) {
        return `
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"></path>
            <path d="M9.88 5.09A10.94 10.94 0 0 1 12 4.91c5.05 0 9.27 3.11 10.5 7.09a11.82 11.82 0 0 1-3.04 4.57"></path>
            <path d="M6.61 6.61A11.84 11.84 0 0 0 1.5 12c1.23 3.98 5.45 7.09 10.5 7.09a10.9 10.9 0 0 0 4.16-.79"></path>
          </svg>
        `;
      }

      return `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1.5 12C2.73 8.02 6.95 4.91 12 4.91S21.27 8.02 22.5 12C21.27 15.98 17.05 19.09 12 19.09S2.73 15.98 1.5 12Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      `;
    }

    function syncPasswordToggle(button, input) {
      const isVisible = input.type === "text";
      button.innerHTML = getPasswordToggleIcon(isVisible);
      button.setAttribute("aria-label", `${isVisible ? "Hide" : "Show"} ${input.labels?.[0]?.textContent?.trim().toLowerCase() || "password"}`);
      button.setAttribute("aria-pressed", isVisible ? "true" : "false");
    }

    function initPasswordToggles() {
      document.querySelectorAll("[data-password-toggle]").forEach((button) => {
        const targetId = button.getAttribute("data-password-toggle");
        const input = targetId ? document.getElementById(targetId) : null;
        if (!(button instanceof HTMLButtonElement) || !(input instanceof HTMLInputElement)) {
          return;
        }

        syncPasswordToggle(button, input);
        button.addEventListener("click", () => {
          input.type = input.type === "password" ? "text" : "password";
          syncPasswordToggle(button, input);
        });
      });
    }

    function readPageMode() {
      const query = new URLSearchParams(window.location.search);
      const queryMode = query.get("mode");

      if (queryMode === "register") {
        return "register";
      }

      if (queryMode === "forgot" || queryMode === "recovery") {
        return "recover-request";
      }

      return "login";
    }

    function syncModeToUrl(nextMode) {
      const url = new URL(window.location.href);

      if (nextMode === "register") {
        url.searchParams.set("mode", "register");
      } else if (nextMode === "recover-request") {
        url.searchParams.set("mode", "forgot");
      } else if (nextMode !== "recover-verify") {
        url.searchParams.delete("mode");
      }

      window.history.replaceState({}, "", url);
    }

    let mode = readPageMode();
    function getPostLoginRedirect() {
      const query = new URLSearchParams(window.location.search);
      const redirect = query.get("redirect");
      if (!redirect || !/^[a-zA-Z0-9-]+\.html$/.test(redirect)) {
        return "index.html";
      }

      return redirect;
    }

    function getOauthReturnUrl() {
      const url = new URL(window.location.href);
      url.searchParams.delete("mode");
      return url.toString();
    }

    function shouldRedirectSignedInUser() {
      return mode !== "recover-request" && mode !== "recover-verify";
    }

    function redirectSignedInUser() {
      if (!shouldRedirectSignedInUser()) {
        return;
      }

      window.setTimeout(() => {
        window.location.href = getPostLoginRedirect();
      }, 700);
    }

    function setStatus(message, type) {
      statusText.textContent = message || "";
      statusText.className = "status";
      if (type) {
        statusText.classList.add(type);
      }
    }

    function applyMode(clearStatus = true) {
      const isLogin = mode === "login";
      const isRegister = mode === "register";
      const isRecoveryRequest = mode === "recover-request";
      const isRecoveryVerify = mode === "recover-verify";

      title.textContent = isLogin
        ? "Welcome back"
        : isRegister
          ? "Create account"
          : isRecoveryRequest
            ? "Forgot password"
            : "Reset password";

      subtitle.textContent = isLogin
        ? ""
        : isRegister
          ? "Create your account to start using DigitQuo."
          : isRecoveryRequest
            ? "Enter your email and we will send you a password reset link."
            : "Open the reset link from your email, then choose a new password.";

      submitBtn.textContent = isLogin
        ? "Log In"
        : isRegister
          ? "Create Account"
          : isRecoveryRequest
            ? "Reset Password"
            : "Reset Password";

      if (googleAuthLabel) {
        googleAuthLabel.textContent = isRegister ? "Sign up with Google" : "Continue with Google";
      }

      rememberRow.style.display = isLogin ? "flex" : "none";
        oauthSection.hidden = isRecoveryRequest || isRecoveryVerify;
        nameField.hidden = !isRegister;
        phoneField.hidden = !isRegister;
        countryField.hidden = !isRegister;
        termsField.hidden = !isRegister;
        refundField.hidden = !isRegister;
        newPasswordField.hidden = !isRecoveryVerify;
        confirmPasswordField.hidden = !isRecoveryVerify;
        passwordInput.parentElement.hidden = isRecoveryRequest || isRecoveryVerify;

        nameInput.required = isRegister;
        phoneInput.required = isRegister;
        countryInput.required = isRegister;
        passwordInput.required = isLogin || isRegister;
        termsCheckbox.required = isRegister;
        refundCheckbox.required = isRegister;
      newPasswordInput.required = isRecoveryVerify;
      confirmPasswordInput.required = isRecoveryVerify;

      toggleLabel.textContent = isLogin
        ? "Don't have an account?"
        : isRegister
          ? "Already have an account?"
          : "Remembered your password?";

      toggleMode.textContent = isLogin
        ? "Create one"
        : "Log in";

      forgotPasswordBtn.hidden = !isLogin;

      if (!isRecoveryVerify) {
        newPasswordInput.value = "";
        confirmPasswordInput.value = "";
      }

      if (clearStatus) {
        setStatus("");
      }
    }

    function setMode(nextMode, clearStatus = true) {
      mode = nextMode;
      syncModeToUrl(nextMode);
      applyMode(clearStatus);
    }

    function loadRememberedLogin() {
      if (typeof dqAuth?.isSessionPersistent === "function") {
        rememberInput.checked = dqAuth.isSessionPersistent();
      }

      const savedEmail = window.localStorage.getItem(REMEMBERED_EMAIL_KEY);
      if (!savedEmail) {
        return;
      }

      emailInput.value = savedEmail;
      rememberInput.checked = true;
    }

    function persistRememberedLogin(email, remember) {
      if (remember) {
        window.localStorage.setItem(REMEMBERED_EMAIL_KEY, email);
        return;
      }

      window.localStorage.removeItem(REMEMBERED_EMAIL_KEY);
    }

    async function ensureProfile(client, user) {
      if (!client || !user) {
        return;
      }

      try {
        const { data, error } = await client
          .from("profiles")
          .select("id")
          .eq("id", user.id)
          .maybeSingle();
        if (error) {
          console.warn("ensureProfile lookup failed:", error);
          return;
        }

        if (data) {
          return;
        }

        const metadata = user.user_metadata || {};
        await client.from("profiles").insert({
          id: user.id,
          email: user.email,
          full_name: metadata.full_name || metadata.fullName || "",
          phone: metadata.phone || "",
          country: metadata.country || metadata.address || "",
          profile_photo: metadata.profile_photo || metadata.profilePhoto || "",
          role: "customer",
          is_active: true,
        });
      } catch (error) {
        console.warn("ensureProfile failed:", error);
      }
    }

    function getConfigErrorMessage() {
      return "Add your Supabase project URL and anon key in supabase-config.js before using login.";
    }

    async function signInWithGoogle() {
      if (!dqAuth || !dqAuth.isConfigured()) {
        setStatus(getConfigErrorMessage(), "error");
        return;
      }

      if (typeof dqAuth.setSessionPersistence === "function") {
        dqAuth.setSessionPersistence(rememberInput.checked);
      }

      googleAuthBtn.disabled = true;
      submitBtn.disabled = true;
      setStatus("Redirecting to Google...", "ok");

      try {
        const client = await dqAuth.getClient();
        const { error } = await client.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: getOauthReturnUrl(),
          },
        });

        if (error) {
          throw error;
        }
      } catch (error) {
        setStatus(error.message || "Could not start Google sign-in.", "error");
        googleAuthBtn.disabled = false;
        submitBtn.disabled = false;
      }
    }

    async function checkSession() {
      if (!dqAuth || !dqAuth.isConfigured()) {
        setStatus(getConfigErrorMessage(), "error");
        return;
      }

      try {
        const client = await dqAuth.getClient();
        const user = await dqAuth.getCurrentUser();
        if (!user) {
          return;
        }

        await ensureProfile(client, user);
        if (await enforceActiveProfile(client, user)) {
          return;
        }

        setStatus(`Signed in as ${user.email}`, "ok");
        redirectSignedInUser();
      } catch (error) {
        setStatus(error.message || "Could not connect to Supabase.", "error");
      }
    }

    async function getProfileStatus(client, userId) {
      if (!client || !userId) {
        return null;
      }

      const { data, error } = await client
        .from("profiles")
        .select("is_active, suspension_reason")
        .eq("id", userId)
        .single();

      if (error) {
        return null;
      }

      return data;
    }

    async function enforceActiveProfile(client, user) {
      const profile = await getProfileStatus(client, user?.id);
      if (!profile || profile.is_active !== false) {
        return false;
      }

      const reason = String(profile.suspension_reason || "").trim();
      await client.auth.signOut();
      setMode("login", false);
      setStatus(reason ? `You are suspended. ${reason}` : "You are suspended.", "error");
      return true;
    }

    toggleMode.addEventListener("click", (event) => {
      event.preventDefault();

      if (mode === "login") {
        setMode("register");
        return;
      }

      setMode("login");
    });

    forgotPasswordBtn.addEventListener("click", () => {
      setMode("recover-request");
    });

    googleAuthBtn.addEventListener("click", () => {
      signInWithGoogle();
    });

    async function requestPasswordReset(client, email) {
      const redirectTo = `${window.location.origin}${window.location.pathname}?mode=recovery`;
      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });

      if (error) {
        throw error;
      }

      setStatus("Reset link sent. Check your email, open the link, then set your new password.", "ok");
    }

    async function handlePasswordRecoveryFromLink(client) {
      const query = new URLSearchParams(window.location.search);
      if (query.get("mode") !== "recovery") {
        return;
      }

      const { data, error } = await client.auth.getSession();
      if (error || !data.session) {
        setMode("recover-request", false);
        setStatus("Open the password reset link from your email to continue.", "error");
        return;
      }

      setMode("recover-verify", false);
      setStatus("Recovery session detected. Enter your new password below.", "ok");
    }

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("");

      const email = emailInput.value.trim();
      const fullName = nameInput.value.trim();
      const phone = phoneInput.value.trim();
      const country = countryInput.value.trim();
      const password = passwordInput.value;
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const remember = rememberInput.checked;

      if (!email) {
        setStatus("Enter a valid email address.", "error");
        return;
      }

      if (mode === "login" && password.length < 8) {
        setStatus("Enter a valid email and a password of at least 8 characters.", "error");
        return;
      }

      if (mode === "register" && (password.length < 8 || !fullName || !phone || !country)) {
        setStatus("Enter a valid email and a password of at least 8 characters.", "error");
        return;
      }

      if (mode === "register" && !termsCheckbox.checked) {
        setStatus("Accept the Terms & Conditions before continuing.", "error");
        return;
      }

      if (mode === "register" && !refundCheckbox.checked) {
        setStatus("Accept the Refund Policy before continuing.", "error");
        return;
      }

      if (mode === "recover-verify") {
        if (newPassword.length < 8 || newPassword !== confirmPassword) {
          setStatus("Enter matching passwords with at least 8 characters.", "error");
          return;
        }
      }

      submitBtn.disabled = true;
      submitBtn.textContent = mode === "login"
        ? "Logging in..."
        : mode === "register"
          ? "Creating..."
          : mode === "recover-request"
            ? "Sending..."
            : "Resetting...";

      try {
        if (!dqAuth || !dqAuth.isConfigured()) {
          setStatus(getConfigErrorMessage(), "error");
          return;
        }

        const client = await dqAuth.getClient();

        if (mode === "register") {
        const { data: authData, error: authError } = await client.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
              phone,
              country,
            },
          },
        });

        if (authError) {
          setStatus(authError.message || "Could not create account.", "error");
          return;
        }

        await ensureProfile(client, authData.user);

        setMode("login", false);
        setStatus("Account created successfully. Check your email if confirmation is enabled, then log in.", "ok");
        return;
        }

        if (mode === "recover-request") {
          await requestPasswordReset(client, email);
          return;
        }

        if (mode === "recover-verify") {
          const { error } = await client.auth.updateUser({ password: newPassword });
          if (error) {
            setStatus(error.message || "Could not update password.", "error");
            return;
          }

          setMode("login", false);
          passwordInput.value = "";
          newPasswordInput.value = "";
          confirmPasswordInput.value = "";
          setStatus("Password updated. You can now log in with your new password.", "ok");
          return;
        }

        if (typeof dqAuth.setSessionPersistence === "function") {
          dqAuth.setSessionPersistence(remember);
        }

        const { data, error } = await client.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          setStatus(error.message || "Login failed.", "error");
          return;
        }

        await ensureProfile(client, data.user);
        if (await enforceActiveProfile(client, data.user)) {
          return;
        }

        persistRememberedLogin(email, remember);
        setStatus(`Welcome, ${data.user.email}`, "ok");
        window.setTimeout(() => {
          window.location.href = getPostLoginRedirect();
        }, 900);
      } catch (error) {
        setStatus(error.message || "Could not connect to Supabase.", "error");
      } finally {
        submitBtn.disabled = false;
        applyMode(false);
      }
    });

    applyMode();
    initPasswordToggles();
    loadRememberedLogin();
    checkSession();
    if (dqAuth && dqAuth.isConfigured()) {
      dqAuth.getClient()
        .then(async (client) => {
          if (!client) {
            return;
          }

          client.auth.onAuthStateChange((eventName) => {
            if (eventName === "PASSWORD_RECOVERY") {
              setMode("recover-verify", false);
              setStatus("Recovery link confirmed. Enter your new password below.", "ok");
              return;
            }

            if (eventName === "SIGNED_IN") {
              checkSession().catch(() => {
                // Keep the page usable even if session sync fails here.
              });
            }
          });

          await handlePasswordRecoveryFromLink(client);
        })
        .catch(() => {
          // Keep the page usable even if the auth client cannot initialize here.
        });
    }
  </script>
</body>
</html>
